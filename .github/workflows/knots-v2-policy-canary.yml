name: Knots v2 Policy Canary
run-name: Knots v2 policy canary ${{ inputs.canary_id }}

on:
  workflow_dispatch:
    inputs:
      canary_id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  trusted-write:
    runs-on: ubuntu-latest
    steps:
      - name: Create protected canary ref as GitHub Actions
        env:
          CANARY_ID: ${{ inputs.canary_id }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${CANARY_ID}" =~ ^[a-z0-9-]+$ ]]
          workdir="$(mktemp -d)"
          git -C "${workdir}" init
          git -C "${workdir}" config user.name "github-actions[bot]"
          git -C "${workdir}" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${workdir}" commit --allow-empty -m "Knots v2 policy canary ${CANARY_ID}"
          protected_head="$(git -C "${workdir}" rev-parse HEAD)"
          git -C "${workdir}" remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -C "${workdir}" push origin \
            "${protected_head}:refs/heads/knots-v2-canary/protected/${CANARY_ID}"
          git -C "${workdir}" commit --allow-empty -m "Knots v2 inbox canary base"
          inbox_base="$(git -C "${workdir}" rev-parse HEAD)"
          git -C "${workdir}" push origin \
            "${inbox_base}:refs/heads/knots-v2-canary/inbox/${CANARY_ID}"
          git -C "${workdir}" commit --allow-empty -m "Knots v2 inbox canary fast-forward"
          inbox_head="$(git -C "${workdir}" rev-parse HEAD)"
          git -C "${workdir}" push origin \
            "${inbox_head}:refs/heads/knots-v2-canary/inbox/${CANARY_ID}"
